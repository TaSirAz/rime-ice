name: AI prototype checks

on:
  push:
    branches: [ai-rerank-sync-prototype]
  pull_request:
    paths:
      - 'lua/ai_rerank.lua'
      - 'tools/ai_rerank/**'
      - '.github/workflows/ai-prototype-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.repository == 'TaSirAz/rime-ice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test and lint dependencies
        run: |
          python -m pip install PyYAML
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks yamllint
          sudo luarocks install luacheck
      - name: Python compatibility and ranking rules
        run: python -m unittest discover -s tools/ai_rerank -p 'test_*.py'
      - name: Lua request and iterator regression tests
        run: lua5.4 tools/ai_rerank/test_filter.lua
      - name: Repository lint
        run: make -C others/script/ lint
